# Batrade Home-SOC — configuración del MVP
# Secretos (token de Telegram, webhook de Discord) van en .env, nunca aquí.

network:
  # Interfaz del sensor. OBLIGATORIA y explícita: con varias NICs la
  # autodetección puede elegir la red equivocada.
  interface: eth1
  # Subred bajo vigilancia (IPv4, /24 recomendado).
  cidr: 192.168.200.0/24
  # Vacío = se toma la puerta de enlace por defecto de la tabla de rutas.
  gateway_ip: 192.168.150.1
  # Vacío = no se evalúa la regla de DHCP no autorizado.
  dhcp_server_ip: null

sensor:
  # auto | live | degraded | replay | simulate
  # auto decide según las capabilities reales del proceso.
  mode: auto
  # Barrido de descubrimiento (RF-01). Rango permitido: 15..300 s.
  sweep_interval: 30
  # Barridos consecutivos sin respuesta para marcar un equipo fuera de línea.
  presence_misses: 3
  heartbeat_interval: 15
  retention_days: 90
  # Vigilancia de la tabla de vecinos vía netlink (no requiere CAP_NET_RAW).
  neighbor_watch: true

scan:
  enabled: true
  # Máximo de nmap simultáneos (RNF-01).
  max_concurrent: 2
  timing: "-T3"
  standard_timeout: 300
  quick_timeout: 120
  # Perfil rápido para reescaneos periódicos.
  quick_periodic_hours: 24
  # Reescaneo semanal de equipos confiables (RF-10).
  weekly_rescan_days: 7
  # Catálogo editable de puertos riesgosos (RF-08).
  # El protocolo es obligatorio: UPnP/SSDP es UDP y un escaneo TCP nunca lo verá.
  risky_ports:
    - { port: 21,   protocol: tcp, service: "FTP",         reason: "Credenciales en claro" }
    - { port: 23,   protocol: tcp, service: "Telnet",      reason: "Acceso remoto sin cifrar" }
    - { port: 2323, protocol: tcp, service: "Telnet-alt",  reason: "Acceso remoto sin cifrar (alt)" }
    - { port: 139,  protocol: tcp, service: "NetBIOS",     reason: "Compartición SMB heredada" }
    - { port: 445,  protocol: tcp, service: "SMB",         reason: "Compartición de archivos expuesta" }
    - { port: 3389, protocol: tcp, service: "RDP",         reason: "Escritorio remoto expuesto" }
    - { port: 5900, protocol: tcp, service: "VNC",         reason: "Escritorio remoto sin cifrar" }
    - { port: 554,  protocol: tcp, service: "RTSP",        reason: "Cámara/vídeo IP expuesto" }
    - { port: 1900, protocol: udp, service: "UPnP/SSDP",   reason: "Mapeo automático de puertos en el router" }
    - { port: 5353, protocol: udp, service: "mDNS",        reason: "Exposición de servicios por multicast" }

detect:
  # Ventana deslizante de las reglas de escaneo (RF-12).
  window_s: 10
  syn_ports_warn: 15
  syn_ports_crit: 100
  syn_dsts_crit: 25
  arp_sweep_ips: 30
  # Verificación activa antes de confirmar ARP spoofing (RF-11 / C2).
  arp_verify: true
  arp_verify_timeout: 1.5
  # MACs exentas de la regla "una MAC reclama varias IPs" (proxy ARP, failover).
  arp_exceptions: []
  # Cooldown de deduplicación por clave de evento (RF-16).
  cooldown_s: 300

notify:
  # Canales activos. 'local' escribe en var/alerts.log y siempre está disponible.
  channels:
    - { type: local }
    # - { type: telegram, token_env: TELEGRAM_TOKEN, chat_id_env: TELEGRAM_CHAT_ID }
    # - { type: discord,  webhook_env: DISCORD_WEBHOOK }
  timeout_s: 8
  max_attempts: 8

dashboard:
  host: 127.0.0.1
  port: 8000
  # Si se expone fuera de loopback, definir auth_token en .env (RNF-05).
  auth_token_env: DASHBOARD_TOKEN

paths:
  # Relativos a la raíz del proyecto.
  db: var/batrade.db
  scans_dir: var/scans
  log_dir: var/log
  alerts_log: var/alerts.log
  # Base OUI local, sin internet (RF-02).
  oui_file: /usr/share/nmap/nmap-mac-prefixes
